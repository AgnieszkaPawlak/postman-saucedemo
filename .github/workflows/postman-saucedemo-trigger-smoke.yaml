name: Trigger Playwright smoke on push

on:
  push:
  workflow_dispatch:

jobs:
  trigger-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch smoke tests to ecom-test-playwright
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.GH_PAT }}
          repository: AgnieszkaPawlak/ecom-test-playwright
          event-type: postman-pr-smoke
          client-payload: >-
            {
              "commit_sha": "${{ github.sha }}",
              "source_repo": "${{ github.repository }}",
              "source_ref": "${{ github.ref_name }}",
              "base_url": "https://practicesoftwaretesting.com"
            }
